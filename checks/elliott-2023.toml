relation = "exact"

# ── Existential statements (§2.3) ────────────────────────────────────────────────────────────

[[item]]
id       = "ex-22"
kind     = "result"
label    = "(22)"
decls    = ["DynamicSemantics.BilateralUpdate.negative_exists_pred1"]
relation = "specializes"
notes    = """
Assumes `x` novel at `s` and a nonempty domain; (22c) is false without either (a familiar `x`
keeps its value, so `g` survives when `g(x)` is not a P though something is; an empty domain
empties `s + x`). The paper takes both for granted.
"""

[[item]]
id       = "ex-23"
kind     = "result"
label    = "(23)"
decls    = ["Elliott2023.negative_exists_pred2"]
relation = "specializes"
notes    = """
Assumes every point of `s` defines the same variables, `x` not among them, `y ≠ x`, and a
nonempty domain.
"""

[[item]]
id       = "sec-2-3-projection"
kind     = "result"
label    = "§2.3, before (23)"
decls    = ["Elliott2023.not_negative_exists_pred2"]
relation = "refutes"
notes    = """
The paper says the denial of `∃x R(x, y)` keeps a point only if it already defines `y`, and that
(23a) equals (23b) in general. The Lean gives a state with a point of a world `w` that defines `y`
and a point of `w` that does not, with `R` empty: the point without `y` lies below an extension of
the other, so it subsists in the negative update of the scope and (23a) keeps it, while (23b)
does not. The equation holds at uniform states (ex-23).
"""

[[item]]
id       = "ex-24"
kind     = "datum"
label    = "(24)"
decls    = ["Elliott2023.familiar_positive_neg_neg_exists", "Elliott2023.ex24"]
relation = "specializes"
notes    = """
The positive update of `¬¬∃x P(x)` makes `x` familiar, so a later pronoun can pick it up; the
general claim, that `¬¬φ` updates as `φ` does, is `neg_neg` (ex-17). `ex24` ties this to the
datum for (24), whose sentence and judgment the signer checks against the paper.
"""

