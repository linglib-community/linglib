# ── Homogeneous readings (§3) ────────────────────────────────────────────────────────────────

[[item]]
id       = "ex-46"
kind     = "definition"
label    = "(45), (46)"
decls    = ["Elliott2023.exhAssert"]
relation = "variant"
notes    = """
Only the output (b) is defined; definedness is `Assertable`, read as for (26) (study erratum).
The QuD is a partition of all worlds rather than of the context set, so the cell-mate `w'` is
required to be a world of the context. (45) is `exhAssert ⊥`: Mathlib's `⊥ : Setoid W` is
equality, so every world is its own cell (the fact-finding question), and `⊤` relates all worlds.
No lemma states this; it holds wherever the worlds of `c[φ]+` are worlds of `c`, as for every
sentence here.
"""

[[item]]
id       = "sec-3-1-cell-1"
kind     = "result"
label    = "§3.1, cell 1"
decls    = ["Elliott2023.world_exhAssert_bot"]
relation = "specializes"
notes    = """
Asserted exhaustively at the fact-finding question, the donkey disjunction keeps the worlds where
every bathroom is upstairs. Stated for the worlds of the output; assumes `x` novel at `s` and a
nonempty domain.
"""

[[item]]
id       = "sec-3-1-cell-2"
kind     = "result"
label    = "§3.1, cell 2"
decls    = ["Elliott2023.world_exhAssert_bot_neg", "Elliott2023.ex12"]
relation = "specializes"
notes    = """
The negated donkey disjunction, (12), keeps the worlds with a bathroom where no bathroom is
upstairs. Same assumptions as cell 1. `ex12` ties the homogeneous reading to the datum for (12),
whose sentence and judgment the signer checks against the paper.
"""

[[item]]
id       = "sec-3-2"
kind     = "result"
label    = "§3.2, heterogeneous readings"
decls    = ["Elliott2023.exhAssert_top"]
relation = "specializes"
notes    = """
The paper's example is a QuD that merges mixed and non-mixed worlds (how Gabe paid). The Lean
takes the extreme case `⊤`, which merges all worlds: exhaustive assertion is then the plain
positive update, provided some world of the context has every bathroom upstairs.
"""

