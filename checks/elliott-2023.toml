[[item]]
id       = "ex-18"
kind     = "definition"
label    = "(18)"
decls    = ["DynamicSemantics.State.randomAssign"]
relation = "exact"
notes    = """
`g[x]h` is not defined in the paper. The Lean reads it as: `h` is `g` with `x` set to an
individual, so `h(x)` is defined, as (19) shows and as (24) requires. On the Groenendijk–Stokhof
reading (`h` differs from `g` at most at `x`), `h(x) = #e` would be allowed.
"""

[[item]]
id       = "ex-20"
kind     = "definition"
label    = "(20)"
decls    = ["DynamicSemantics.BilateralUpdate.exists_"]
relation = "exact"

[[item]]
id       = "ex-21"
kind     = "definition"
label    = "(21)"
decls    = ["DynamicSemantics.Possibility.le_def"]
relation = "variant"
notes    = """
Subsistence `i ≺ s` is `i ∈ lowerClosure s`, for the order of `le_def`: a descendant has the same
world and extends the assignment, agreeing wherever it is defined, as the prose before (21) puts
it. (21) itself asks only that the descendant be defined on at least the same variables, which
would let it reassign them: on that reading `(w, [x→a])` subsists in `{(w, [x→b])}` (study
erratum).
"""

[[item]]
id       = "ex-25"
kind     = "definition"
label    = "(25)"
decls    = ["DynamicSemantics.BilateralUpdate.unknownUpdate"]
relation = "exact"
notes    = "The paper calls `s[φ]?` presupposition failure; the Lean calls it the unknown update."

[[item]]
id       = "ex-26"
kind     = "definition"
label    = "(26)"
decls    = ["DynamicSemantics.BilateralUpdate.Assertable"]
relation = "variant"
notes    = """
Only the definedness condition (26a) is a definition; the output (26b) is the positive update.
(26a) says assertion is defined when `c[φ]? ≠ ∅`, but the prose (and footnote 6) require the
unknown update to be empty, and `Assertable` follows the prose (study erratum).
"""

[[item]]
id       = "sec-2-4-1-familiarity"
kind     = "result"
label    = "§2.4.1, before (26)"
decls    = ["Elliott2023.assertable_not_familiar"]
relation = "refutes"
notes    = """
The paper says Heimian familiarity follows from (26): for a sentence with a free `x` to be
assertable at `c`, `x` must be defined at every point of `c`. The Lean gives a state with a point
of a world `w` that defines `x` and a point of `w` that does not, at which `P(x)`, with `P` true of
everything, is assertable but `x` is not familiar: the point without `x` lies below the one with
it, so it subsists in the positive update and the unknown update is empty.
"""

[[item]]
id       = "ex-27"
kind     = "definition"
label    = "(27)"
decls    = ["DynamicSemantics.BilateralUpdate.conj", "DynamicSemantics.BilateralUpdate.positive_conj"]
relation = "exact"
notes    = """
Conjunction is the lift of strong Kleene conjunction, the recipe the paper describes: +, − and ?
are `1`, `-1` and `0`, and fig. 1 is `⊓` for Mathlib's order `-1 < 0 < 1`. Fig. 1 is headed
"φ ∨ ψ", a typo for "φ ∧ ψ". `positive_conj` is (27) as stated.
"""

[[item]]
id       = "ex-28"
kind     = "definition"
label    = "(28)"
decls    = ["DynamicSemantics.BilateralUpdate.conj"]
relation = "exact"
notes    = """
The negative update of the lift is the union over the cells of the table with value `-1`, which
are the five cells of (28). No lemma states (28) in its own form.
"""

[[item]]
id       = "ex-29"
kind     = "definition"
label    = "(29)"
decls    = ["DynamicSemantics.BilateralUpdate.disj",
            "DynamicSemantics.BilateralUpdate.positive_disj_eq_union"]
relation = "exact"
notes    = """
Disjunction is the lift of strong Kleene disjunction: +, − and ? are `1`, `-1` and `0`, and fig. 2
is `⊔` for Mathlib's order `-1 < 0 < 1`. `positive_disj_eq_union` splits (29)
into the two lines of the paper, the first disjunct true and the second disjunct true; the two
parts overlap in the cell where both are true, which (29) lists once.
"""

