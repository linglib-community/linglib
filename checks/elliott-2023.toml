Under a Strong Kleene semantics for material implication, φ→ψ ⇔ ¬φ∨ψ. With DNE, a
donkey conditional such as (48b), "If there's a bathroom, then it's upstairs", is then predicted
to have the same truth-conditions as the donkey disjunction (48a), "Either there isn't a bathroom,
or it's upstairs", and ∀-readings can be derived by the same mechanism.
"""
