[[item]]
id       = "ex-31"
kind     = "result"
label    = "(31)"
decls    = ["Elliott2023.firstPart_donkey"]
relation = "specializes"
notes    = """
Assumes `x` novel at `s`. States the first equality; the second is (22). The paper justifies the
first by the updates of `U(x)` partitioning their input, which fails in general
(sec-2-4-3-partition) but holds where `x` is novel.
"""

[[item]]
id       = "sec-2-4-3-partition"
kind     = "result"
label    = "§2.4.3, before (31)"
decls    = ["Elliott2023.not_cover_pred1"]
relation = "refutes"
notes    = """
The paper says the positive, negative and unknown updates of `U(x)` partition their input. The
Lean gives a state with a point of a world `w` that defines `x` and a point of `w` that does not,
with `U` true of everything: the point without `x` lies below the one with it, so it subsists in
the positive update and is not in the unknown update, and it is in neither of the other two.
"""

