name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  ELAN_NO_OVERRIDE_NOTICE: 1

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check generated experimental data
        run: python3 scripts/gen_experiments.py --check

      - name: Check generated WALS data (imported features only, in sync)
        run: python3 scripts/gen_wals.py --check

      - name: Check generated PHOIBLE data
        run: python3 scripts/gen_phoible.py --check

      - name: Check generated example data
        run: python3 scripts/gen_examples.py --check

      - name: Check generated verb class data
        run: python3 scripts/gen_verb_classes.py --check

      - name: Check generated form data
        run: python3 scripts/gen_wordlist.py --check

      - name: Check generated language sample data
        run: python3 scripts/gen_structure_dataset.py --check

      - name: Check generated word order data
        run: python3 scripts/gen_word_order.py --check

      - name: Check generated word order corpus data
        run: python3 scripts/gen_word_order_corpus.py --check

      - name: Check generated hiatus data
        run: python3 scripts/gen_hiatus.py --check

      - name: Check generated dependency length data
        run: python3 scripts/gen_ud_deplength.py --check

      - name: Check example literals in studies
        run: python3 scripts/check_examples.py

      - name: Check headline theorems in studies
        run: python3 scripts/check_headliners.py

      - name: Check docstring links resolve
        run: python3 scripts/check_doc_links.py

      - name: Check that the bibliography page renders every entry's TeX
        run: python3 scripts/gen_bibliography_page.py --check

      - name: Check English verbs' Levin classes against the member lists
        run: python3 scripts/check_levin_classes.py

      - name: Validate example data as CLDF
        run: |
          python3 -m venv "$RUNNER_TEMP/cldf-venv"
          "$RUNNER_TEMP/cldf-venv/bin/pip" install --quiet pycldf==2.1.1
          "$RUNNER_TEMP/cldf-venv/bin/python" scripts/export_examples_cldf.py --validate "$RUNNER_TEMP/cldf-examples"

      - name: Install elan
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> $GITHUB_PATH

      - name: Install and activate toolchain
        run: |
          elan toolchain install $(cat lean-toolchain)
          elan override set $(cat lean-toolchain)
          lake --version

      - name: Cache .lake
        uses: actions/cache@v4
        with:
          path: .lake
          key: lake-${{ runner.os }}-${{ hashFiles('lean-toolchain') }}-${{ hashFiles('lake-manifest.json') }}-${{ hashFiles('Linglib/**/*.lean', 'Studies/**/*.lean', 'Eval/**/*.lean', 'Lab/**/*.lean', 'Linglib.lean') }}
          restore-keys: |
            lake-${{ runner.os }}-${{ hashFiles('lean-toolchain') }}-${{ hashFiles('lake-manifest.json') }}-

      - name: Get Mathlib cache
        run: lake exe cache get

      - name: Build
        run: lake build

      - name: Build the evaluations page from the verdict theorems
        run: python3 scripts/gen_eval_page.py --export

      - name: Check for sorries (informational)
        run: |
          echo "=== Files with sorry ==="
          grep -r "sorry" Linglib/ Studies/ --include="*.lean" | grep -v "-- " | head -50 || echo "No sorries found"
