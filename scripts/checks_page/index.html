<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wiki | Linglib</title>
<meta name="description" content="Sources whose statements a person has read against the Lean that states them.">
<meta name="robots" content="noindex">
<!--SITE_HEAD-->
<style>
/* Sources with a record */
:root { --checked: #22c55e; --open: #d6d6d6; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --open: #4a4b4e; } }
:root[data-theme="dark"] { --open: #4a4b4e; }
.lede { margin: 0 0 28px; color: var(--secondary); }
ul.sources { list-style: none; margin: 0; padding: 0; }
.source { margin: 0 0 1.2em; padding-left: 12px; border-left: 3px solid var(--open); line-height: 1.5; }
.source.all { border-left-color: var(--checked); }
.source.some { border-left: 3px dashed var(--checked); }
.source a strong { font-weight: 600; }
.source a:hover { text-decoration: underline; text-decoration-color: var(--tertiary); text-underline-offset: 3px; }
.tally { display: block; font-size: 14px; color: var(--secondary); }
</style>
</head>
<body id="top">
<!--SITE_HEADER-->
<main class="main">
  <h1>Wiki</h1>
  <p class="lede">Lean checks a proof against its statement. A person checks the statement against the paper.</p>
  <ul class="sources">
<!--SOURCES-->
  </ul>
</main>
<!--SITE_FOOTER-->
<!--SITE_SCRIPT-->
</body>
</html>
