<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bibliography | Linglib</title>
<meta name="description" content="Papers referenced, cited, or formalized in Linglib.">
<!--SITE_HEAD-->
<style>
/* Bibliography */
:root { --formalized: #22c55e; --foundational: #a78bfa; --cited: #d6d6d6; --control: #e2e2e2; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --cited: #4a4b4e; --control: #414244; }
}
:root[data-theme="dark"] { --cited: #4a4b4e; --control: #414244; }

/* Toolbar */
.search { position: sticky; top: 0; z-index: 2; background: var(--theme); padding: 12px 0 8px; }
#q {
  width: 100%; padding: 10px 14px; font: inherit; font-size: 17px; color: var(--primary);
  background: var(--entry); border: 1px solid var(--tertiary); border-radius: 8px; outline: none;
  -webkit-appearance: none; appearance: none;
}
#q:focus { border-color: var(--secondary); }
#q::placeholder { color: var(--secondary); opacity: 0.8; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 8px; }
.filter {
  padding: 3px 11px; font-size: 15px; line-height: 1.5; color: var(--secondary);
  border: 1px solid var(--control); border-radius: 6px;
}
.filter:hover { color: var(--primary); }
.filter .n { font-variant-numeric: tabular-nums; }
.filter.role::before {
  content: ""; display: inline-block; width: 3px; height: 0.95em; margin-right: 7px;
  vertical-align: -0.1em; background: var(--bar); opacity: 0.35;
}
.filter.role[aria-pressed="true"] { color: var(--primary); border-color: var(--tertiary); }
.filter.role[aria-pressed="true"]::before { opacity: 1; }
.filter.tag[aria-pressed="true"] { background: var(--primary); border-color: var(--primary); color: var(--theme); }
#sort { margin-left: auto; }
.status { font-size: 15px; color: var(--secondary); margin: 14px 0 22px; min-height: 1.6em; }
.status button { color: var(--primary); text-decoration: underline; text-decoration-color: var(--tertiary); text-underline-offset: 3px; }
.status button:hover { text-decoration-color: currentColor; }

/* Entries */
ol.entries { list-style: none; margin: 0; padding: 0; }
.entry {
  margin: 0 0 1.4em; padding: 0 0 0 12px; border-left: 3px solid var(--cited);
  scroll-margin-top: 90px; content-visibility: auto; contain-intrinsic-size: auto 90px;
}
.entry.formalized { border-left-color: var(--formalized); }
.entry.foundational { border-left-color: var(--foundational); }
.entry.hit { background: var(--code-bg); box-shadow: 0 0 0 6px var(--code-bg); }
.cite { margin: 0; line-height: 1.5; }
.cite strong { font-weight: 600; color: var(--primary); }
.cite .t { text-decoration: underline; text-decoration-thickness: 1px; text-decoration-color: var(--tertiary); text-underline-offset: 3px; }
.cite .t:hover { text-decoration-color: currentColor; }
.anchor { margin-left: 6px; color: var(--secondary); opacity: 0; font-size: 0.9em; }
.entry:hover .anchor, .anchor:focus-visible { opacity: 1; }
.files { margin-top: 3px; font-size: 14px; line-height: 1.6; color: var(--secondary); }
.files a { color: var(--secondary); margin-right: 0.85em; }
.files a:hover { color: var(--primary); text-decoration: underline; text-underline-offset: 2px; }
.files button { color: var(--secondary); text-decoration: underline; text-decoration-color: var(--tertiary); text-underline-offset: 2px; }
.files button:hover { color: var(--primary); }
.empty { color: var(--secondary); }

@media (max-width: 600px) {
  #q { font-size: 16px; }
  .filter { font-size: 14px; padding: 2px 9px; }
  .filter .n { display: none; }
  .status { font-size: 14px; }
  .files { font-size: 13px; }
}
</style>
</head>
<body id="top">
<!--SITE_HEADER-->

<main class="main">
  <h1>Bibliography</h1>

  <div class="search">
    <input id="q" type="search" placeholder="Search by author, title, year, or file" aria-label="Search the bibliography" autocomplete="off" spellcheck="false">
  </div>
  <div class="row" id="roles" role="group" aria-label="Role"></div>
  <div class="row" id="tags" role="group" aria-label="Area"></div>
  <p class="status" id="status" aria-live="polite"></p>
  <ol class="entries" id="list"></ol>
</main>

<!--SITE_FOOTER-->

<script type="application/json" id="bib-data">/*BIB_DATA*/{}</script>
<script>
(function () {
  "use strict";
  const data = JSON.parse(document.getElementById("bib-data").textContent);
  const all = data.entries || [];
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const num = (n) => n.toLocaleString("en-US");
  const fold = (s) => s.normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase()
    .replace(/ı/g, "i").replace(/ø/g, "o").replace(/ł/g, "l").replace(/ß/g, "ss").replace(/æ/g, "ae").replace(/œ/g, "oe");

  const ROLES = ["formalized", "foundational", "cited"];
  const DEFAULT_ROLES = all.some((e) => e.role) ? ["formalized", "foundational"] : ROLES;
  const TAGS = ["Pragmatics", "Semantics", "Syntax", "Morphology", "Phonology", "Typology", "Other"];
  const tagOf = (area) => { const t = area ? area[0].toUpperCase() + area.slice(1) : ""; return TAGS.includes(t) && t !== "Other" ? t : "Other"; };
  const shortPath = (p) => p.replace(/^(Linglib|Studies)\//, "").replace(/\.lean$/, "");
  const FIRST = 5;

  // ---- entries, rendered once; filtering toggles `hidden`, sorting reorders the nodes
  const list = $("list");
  for (const e of all) {
    e.role = ROLES.includes(e.role) ? e.role : "cited";
    e.tag = tagOf(e.area);
    e.hay = fold(e.search + " " + e.authors);
    e.paths = fold(e.places.map((p) => p.path).join(" "));
  }
  // A term searches file paths only when it looks like one (`semantics/modality`, `kratzer1998`),
  // so an author's name does not also find everything cited in a study named after them.
  const pathy = (t) => t.includes("/") || /[a-z]\d/.test(t);
  const hit = (e, t) => e.hay.includes(t) || (pathy(t) && e.paths.includes(t));
  // A data file and the module generated from it are one place: keep the module.
  for (const e of all) {
    const lean = new Set(e.places.filter((p) => p.path.endsWith(".lean")).map((p) => p.path.slice(0, -5)));
    e.places = e.places.filter((p) => !p.path.endsWith(".json") || !lean.has(p.path.slice(0, -5)));
  }
  const link = (p) => `<a href="${esc(p.href)}" title="${esc(p.path)}">${esc(shortPath(p.path))}</a>`;
  function files(e) {
    const ps = e.places;
    if (!ps.length) return "";
    const n = ps.length > FIRST + 1 ? FIRST : ps.length;
    return `<div class="files">${ps.slice(0, n).map(link).join(" ")}` +
      (ps.length > n ? ` <button type="button" data-more>and ${ps.length - n} more</button>` : "") + `</div>`;
  }
  // An unclosed <i> would italicize every entry after it.
  const balance = (h) => { const n = (h.match(/<i>/g) || []).length - (h.match(/<\/i>/g) || []).length; return n > 0 ? h + "</i>".repeat(n) : h; };
  function entry(e) {
    const title = balance(e.title || "");
    e.venue = balance(e.venue || "");
    const plain = title.replace(/<[^>]+>/g, "");
    const href = e.doi ? `https://doi.org/${e.doi}` : e.url;
    const t = href ? `<a class="t" href="${esc(href)}">${title}</a>` : title;
    const end = /[.?!]$/.test(plain) ? "" : ".";
    const venue = e.venue ? ` ${e.venue}${/[.?!]$/.test(e.venue.replace(/<[^>]+>/g, "")) ? "" : "."}` : "";
    return `<li class="entry ${e.role}" id="${esc(e.key)}"><p class="cite">` +
      (e.authors ? `<strong>${esc(e.authors)}</strong> ` : "") + (e.year ? `(${esc(e.year)}). ` : "") +
      `${t}${end}${venue}<a class="anchor" href="#${esc(e.key)}" title="${esc(e.key)}" aria-label="Link to ${esc(e.key)}">#</a></p>` +
      files(e) + `</li>`;
  }
  // Nodes are made the first time an entry is shown, so the default view builds only its third.
  let stale = true;
  function ensure(es) {
    const missing = es.filter((e) => !e.el);
    if (!missing.length) return;
    const tpl = document.createElement("template");
    tpl.innerHTML = missing.map(entry).join("");
    const made = Array.from(tpl.content.children);
    missing.forEach((e, i) => { e.el = made[i]; });
    stale = true;
  }
  const byAuthor = all.slice();
  const byYear = all.slice().sort((a, b) => (b.year || "").localeCompare(a.year || ""));

  // ---- controls
  const roleCount = {}, tagCount = {};
  for (const e of all) { roleCount[e.role] = (roleCount[e.role] || 0) + 1; tagCount[e.tag] = (tagCount[e.tag] || 0) + 1; }
  $("roles").innerHTML = ROLES.map((r) =>
    `<button type="button" class="filter role" data-role="${r}" style="--bar: var(--${r})">${r} <span class="n">(${num(roleCount[r] || 0)})</span></button>`).join("") +
    `<button type="button" class="filter" id="sort" title="Sort order"></button>`;
  $("tags").innerHTML = TAGS.filter((t) => tagCount[t]).map((t) =>
    `<button type="button" class="filter tag" data-tag="${t}">${t}</button>`).join("");

  const q = $("q"), status = $("status"), sortBtn = $("sort");
  let roles = new Set(DEFAULT_ROLES), tags = new Set(), sort = "az", order = "", hiding = [];

  function paint() {
    for (const b of document.querySelectorAll(".role")) b.setAttribute("aria-pressed", roles.has(b.dataset.role));
    for (const b of document.querySelectorAll(".tag")) b.setAttribute("aria-pressed", tags.has(b.dataset.tag));
    sortBtn.textContent = sort === "year" ? "Newest" : "A–Z";
  }

  function apply() {
    const terms = fold(q.value).split(/\s+/).filter(Boolean);
    const on = [], hiddenBy = {};
    for (const e of all) {
      const match = (!tags.size || tags.has(e.tag)) && terms.every((t) => hit(e, t));
      e.on = match && roles.has(e.role);
      if (e.on) on.push(e);
      else if (match) hiddenBy[e.role] = (hiddenBy[e.role] || 0) + 1;
    }
    ensure(on);
    if (stale || order !== sort) {
      const f = document.createDocumentFragment();
      for (const e of sort === "year" ? byYear : byAuthor) if (e.el) f.appendChild(e.el);
      list.appendChild(f);
      order = sort;
      stale = false;
    }
    for (const e of all) if (e.el && e.el.hidden === e.on) e.el.hidden = !e.on;
    const shown = on.length;
    const more = hiding = ROLES.filter((r) => hiddenBy[r]);
    const extra = terms.length && more.length
      ? ` <button type="button" id="reveal">${num(more.reduce((s, r) => s + hiddenBy[r], 0))} more in ${more.join(" and ")}</button>` : "";
    status.innerHTML = shown || extra
      ? `${num(shown)} ${shown === 1 ? "entry" : "entries"}${extra ? " ·" + extra : ""}`
      : "No entries match.";
    paint();
  }
  const update = () => { apply(); save(); };

  // ---- URL hash: #q=…&role=…&tag=…&sort=year, or #key for one entry
  function save() {
    const p = new URLSearchParams();
    if (q.value.trim()) p.set("q", q.value.trim());
    const r = ROLES.filter((x) => roles.has(x));
    if (r.join() !== DEFAULT_ROLES.join()) p.set("role", r.join(","));
    if (tags.size) p.set("tag", TAGS.filter((x) => tags.has(x)).join(","));
    if (sort !== "az") p.set("sort", sort);
    const h = p.toString();
    history.replaceState(null, "", h ? "#" + h : location.pathname + location.search);
  }
  function load() {
    const h = decodeURIComponent(location.hash.slice(1));
    if (!h) return null;
    if (!h.includes("=")) return all.some((e) => e.key === h) ? h : null;
    const p = new URLSearchParams(h);
    if (p.has("role")) roles = new Set(p.get("role").split(",").filter((x) => ROLES.includes(x)));
    if (p.has("tag")) tags = new Set(p.get("tag").split(",").filter((x) => TAGS.includes(x)));
    if (p.has("q")) q.value = p.get("q");
    if (p.get("sort") === "year") sort = "year";
    return null;
  }

  // ---- events
  let timer;
  q.addEventListener("input", () => { clearTimeout(timer); timer = setTimeout(update, 100); });
  q.addEventListener("keydown", (ev) => { if (ev.key === "Escape" && q.value) { q.value = ""; update(); } });
  $("roles").addEventListener("click", (ev) => {
    const b = ev.target.closest("button");
    if (!b) return;
    if (b === sortBtn) sort = sort === "az" ? "year" : "az";
    else roles.has(b.dataset.role) ? roles.delete(b.dataset.role) : roles.add(b.dataset.role);
    update();
  });
  $("tags").addEventListener("click", (ev) => {
    const b = ev.target.closest("button");
    if (!b) return;
    tags.has(b.dataset.tag) ? tags.delete(b.dataset.tag) : tags.add(b.dataset.tag);
    update();
  });
  status.addEventListener("click", (ev) => {
    if (ev.target.id !== "reveal") return;
    hiding.forEach((r) => roles.add(r));
    update();
  });
  const byKey = new Map(all.map((e) => [e.key, e]));
  list.addEventListener("click", (ev) => {
    const b = ev.target.closest("button[data-more]");
    if (!b) return;
    const e = byKey.get(b.closest(".entry").id);
    b.insertAdjacentHTML("beforebegin", e.places.slice(FIRST).map(link).join(" "));
    b.remove();
  });
  document.addEventListener("keydown", (ev) => {
    if (ev.key === "/" && !/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName)) { ev.preventDefault(); q.focus(); }
  });

  // A #key link shows that entry, relaxing the filters only if they hide it.
  function go(target) {
    if (!target) return apply();
    const e = all.find((x) => x.key === target);
    apply();
    if (!e.on) { roles.add(e.role); tags.clear(); q.value = ""; apply(); }
    for (const h of list.querySelectorAll(".hit")) h.classList.remove("hit");
    e.el.classList.add("hit");
    requestAnimationFrame(() => e.el.scrollIntoView());
  }
  addEventListener("hashchange", () => {
    if (location.hash.includes("=")) { roles = new Set(DEFAULT_ROLES); tags = new Set(); q.value = ""; sort = "az"; }
    go(load());
  });
  go(load());
})();
</script>
<!--SITE_SCRIPT-->
</body>
</html>
